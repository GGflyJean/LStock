services:
  l-stock:
    image: ${LSTOCK_IMAGE:-ghcr.io/ggflyjean/l-stock:latest}
    container_name: l-stock
    restart: unless-stopped
    ports:
      - "${LSTOCK_PORT:-18084}:8080"
    environment:
      DATA_DIR: /data
      DB_PATH: /data/l_stock.db
      BIND_ADDR: 0.0.0.0:8080
      AUTH_USER: ${AUTH_USER:?请设置 AUTH_USER}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:?请设置 AUTH_PASSWORD_HASH}
      REFRESH_TIMES_CN: ${REFRESH_TIMES_CN:-09:30,13:00,14:45}
      REFRESH_TIMES_US: ${REFRESH_TIMES_US:-09:30,12:00,15:45}
      REFRESH_OPEN_OFFSET_SECS: ${REFRESH_OPEN_OFFSET_SECS:-60}
      REFRESH_COOLDOWN_SECS: ${REFRESH_COOLDOWN_SECS:-60}
      SNAPSHOT_RETENTION: ${SNAPSHOT_RETENTION:-30}
      STALE_AFTER_SECS: ${STALE_AFTER_SECS:-21600}
      MAX_CONCURRENCY: ${MAX_CONCURRENCY:-4}
    volumes:
      - ${LSTOCK_DATA_DIR:-./data}:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
