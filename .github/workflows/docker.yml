name: docker

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/ggflyjean/l-stock:latest
            ghcr.io/ggflyjean/l-stock:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Tag image for offline import
        run: |
          docker pull ghcr.io/ggflyjean/l-stock:${{ github.sha }}
          docker tag ghcr.io/ggflyjean/l-stock:${{ github.sha }} l-stock:local
      - name: Smoke test image binary
        run: docker run --rm ghcr.io/ggflyjean/l-stock:${{ github.sha }} --help | grep -qi "serve"
      - name: Export image tarball
        run: docker save l-stock:local | gzip > l-stock-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: l-stock-image
          path: l-stock-image.tar.gz
          retention-days: 14
